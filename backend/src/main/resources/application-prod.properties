server.address=0.0.0.0
server.port=${PORT:8080}
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# Supabase transaction pooler (port 6543) rejects named server-side prepared statements.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple
spring.jpa.hibernate.ddl-auto=update
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
