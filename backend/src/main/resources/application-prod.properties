server.address=0.0.0.0
server.port=${PORT:8080}
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# Supabase transaction pooler (port 6543) rejects named server-side prepared statements.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple
# The session pooler speaks Postgres SSL startup, not direct TLS. Skip the GSS probe.
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.gssEncMode=disable
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
# Supabase public is never empty. Baseline at 0 so V1 and V2 still run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.forward-headers-strategy=framework
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
